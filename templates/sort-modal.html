<div x-show="activeDialog === 'sort'" x-cloak>
  <div class="slide-panel-backdrop" @click="closeDialog()"></div>
  <div class="slide-panel" @click.stop>
    <div class="slide-panel__header">
      <h2 class="slide-panel__title">Sort</h2>
      <button class="slide-panel__close" @click="closeDialog()" title="Close">×</button>
    </div>

    <div class="slide-panel__content">
      <div class="form-group">
        <label class="form-label">Sort by:</label>
        <select class="form-input" x-model="sortDialogState.field">
          <template x-for="col in columns" :key="col">
            <option :value="col" x-text="col"></option>
          </template>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Order:</label>
        <div style="display: flex; gap: 1rem">
          <label class="radio-label">
            <input type="radio" x-model="sortDialogState.order" value="asc" />
            <span>Ascending</span>
          </label>
          <label class="radio-label">
            <input type="radio" x-model="sortDialogState.order" value="desc" />
            <span>Descending</span>
          </label>
        </div>
      </div>
    </div>

    <div class="slide-panel__footer">
      <button class="button button--secondary" @click="closeDialog()">Cancel</button>
      <button class="button button--primary" @click="applySortTransform()">Apply</button>
    </div>
  </div>
</div>
