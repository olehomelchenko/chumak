<div class="form-group">
  <label class="form-label">Number of rows:</label>
  <input
    type="number"
    class="form-input"
    x-model.number="sliceRowsDialogState.count"
    min="1"
    placeholder="10"
  />
</div>

<div class="form-group">
  <label class="form-label">Mode:</label>
  <div style="display: flex; flex-direction: column; gap: 0.75rem">
    <label class="radio-label">
      <input type="radio" x-model="sliceRowsDialogState.mode" value="first" />
      <span>Keep first N rows</span>
    </label>
    <label class="radio-label">
      <input type="radio" x-model="sliceRowsDialogState.mode" value="last" />
      <span>Keep last N rows</span>
    </label>
    <label class="radio-label">
      <input type="radio" x-model="sliceRowsDialogState.mode" value="removeFirst" />
      <span>Remove first N rows</span>
    </label>
    <label class="radio-label">
      <input type="radio" x-model="sliceRowsDialogState.mode" value="removeLast" />
      <span>Remove last N rows</span>
    </label>
  </div>
</div>

<div
  class="form-group"
  style="
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--color-light-gray);
    border-radius: var(--radius-sm);
  "
>
  <span style="font-size: 0.875rem; color: var(--color-dark-gray)">
    <template x-if="sliceRowsDialogState.mode === 'first'">
      <span
        >Will keep rows 1 to
        <strong x-text="Math.min(sliceRowsDialogState.count, currentData?.length || 0)"></strong
      ></span>
    </template>
    <template x-if="sliceRowsDialogState.mode === 'last'">
      <span
        >Will keep rows
        <strong
          x-text="Math.max(1, (currentData?.length || 0) - sliceRowsDialogState.count + 1)"
        ></strong>
        to <strong x-text="currentData?.length || 0"></strong
      ></span>
    </template>
    <template x-if="sliceRowsDialogState.mode === 'removeFirst'">
      <span
        >Will remove rows 1 to
        <strong x-text="Math.min(sliceRowsDialogState.count, currentData?.length || 0)"></strong
      ></span>
    </template>
    <template x-if="sliceRowsDialogState.mode === 'removeLast'">
      <span
        >Will remove rows
        <strong
          x-text="Math.max(1, (currentData?.length || 0) - sliceRowsDialogState.count + 1)"
        ></strong>
        to <strong x-text="currentData?.length || 0"></strong
      ></span>
    </template>
    <span style="margin-left: 0.5rem; color: var(--color-medium-gray)">
      (of <span x-text="currentData?.length?.toLocaleString() || 0"></span> total rows)
    </span>
  </span>
</div>
