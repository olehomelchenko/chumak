<div class="form-group">
  <label class="form-label">CSV URL:</label>
  <input
    type="url"
    class="form-input"
    x-model="importUrlDialogState.url"
    placeholder="https://example.com/data.csv"
    @keydown.enter="fetchAndImportFromUrl()"
    autofocus
  />
  <p class="form-help">Enter the direct link to a CSV or TSV file.</p>
</div>

<div x-show="importUrlDialogState.error" class="form-error" style="margin-top: 1rem">
  <span class="iconify" data-icon="carbon:warning"></span>
  <span x-text="importUrlDialogState.error"></span>
</div>

<div
  x-show="importUrlDialogState.isFetching"
  style="
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--color-dark-gray);
  "
>
  <span class="iconify spinning" data-icon="carbon:renew"></span>
  <span>Fetching data...</span>
</div>
