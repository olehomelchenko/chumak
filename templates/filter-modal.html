<label class="form-label">Keep rows where:</label>
<input
  type="text"
  class="form-input"
  x-model="filterExpression"
  placeholder="e.g., sales > 1000"
  @input="validateFilterExpression()"
/>
<p class="form-help">
  Examples: sales > 1000, region == "North", sales > 1000 && region == "North"
</p>

<!-- Error message -->
<div
  x-show="filterError"
  x-text="filterError"
  style="
    color: var(--color-red);
    font-size: 13px;
    margin-top: 8px;
    white-space: pre-wrap;
    font-family: var(--font-family-mono);
  "
></div>
