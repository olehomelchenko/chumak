<div class="modal-backdrop" x-show="activeDialog === 'download'" x-cloak @click="closeDialog()">
  <div class="modal" @click.stop style="max-width: 400px">
    <div class="modal__header">
      <h3 class="modal__title">Download Options</h3>
      <button class="modal__close" @click="closeDialog()">×</button>
    </div>
    <div class="modal__content">
      <div style="display: flex; flex-direction: column; gap: var(--space-md)">
        <p
          style="
            font-size: var(--font-size-base);
            color: var(--color-dark-gray);
            margin-bottom: var(--space-sm);
          "
        >
          Select what you would like to download:
        </p>

        <button
          class="button button--secondary"
          @click="exportCSV(); closeDialog()"
          style="
            justify-content: flex-start;
            gap: var(--space-md);
            padding: var(--space-md);
            display: flex;
            align-items: center;
            width: 100%;
          "
        >
          <span
            class="iconify"
            data-icon="material-symbols-light:csv-outline-rounded"
            style="width: 24px; height: 24px; flex-shrink: 0"
          ></span>
          <div style="text-align: left">
            <div style="font-weight: var(--font-weight-medium)">Recent Model (CSV)</div>
            <div style="font-size: var(--font-size-xs); opacity: 0.7">
              Export current model data as a CSV file
            </div>
          </div>
        </button>

        <button
          class="button button--secondary"
          @click="exportDataJSON(); closeDialog()"
          style="
            justify-content: flex-start;
            gap: var(--space-md);
            padding: var(--space-md);
            display: flex;
            align-items: center;
            width: 100%;
          "
        >
          <span
            class="iconify"
            data-icon="material-symbols-light:file-json-outline-rounded"
            style="width: 24px; height: 24px; flex-shrink: 0"
          ></span>
          <div style="text-align: left">
            <div style="font-weight: var(--font-weight-medium)">Recent Model (JSON)</div>
            <div style="font-size: var(--font-size-xs); opacity: 0.7">
              Export current model data as a JSON file
            </div>
          </div>
        </button>

        <button
          class="button button--secondary"
          @click="exportWorkflowJSON(); closeDialog()"
          style="
            justify-content: flex-start;
            gap: var(--space-md);
            padding: var(--space-md);
            display: flex;
            align-items: center;
            width: 100%;
          "
        >
          <span
            class="iconify"
            data-icon="carbon:document"
            style="width: 24px; height: 24px; flex-shrink: 0"
          ></span>
          <div style="text-align: left">
            <div style="font-weight: var(--font-weight-medium)">Workflow (JSON)</div>
            <div style="font-size: var(--font-size-xs); opacity: 0.7">
              Export transformation steps as a JSON workflow
            </div>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
