<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syto — Data Wrangling in the Browser</title>
    <link rel="stylesheet" href="https://unpkg.com/normalize.css@8/normalize.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="icon" type="image/svg+xml" href="/syto/logo.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Finlandica:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />

    <!-- Core Infrastructure -->
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <script type="module" src="src/main.tsx"></script>

    <!-- GoatCounter Analytics - Privacy-respecting, GDPR-compliant (production only) -->
    <script type="module">
      // Only load in production builds and if user hasn't opted out
      // IMPORTANT: This check happens BEFORE the script is created/loaded.
      // If user has opted out, the script is never appended to the page.
      if (import.meta.env.PROD) {
        // Check localStorage for opt-out preference BEFORE loading
        let shouldLoad = true;
        try {
          const settings = localStorage.getItem('syto-ux-settings');
          if (settings) {
            const parsed = JSON.parse(settings);
            if (parsed.analyticsOptOut === true) {
              // User has opted out, don't load analytics
              shouldLoad = false;
            }
          }
        } catch (e) {
          // If we can't read settings, proceed with loading analytics (default behavior)
        }

        // Only create and append script if user hasn't opted out
        if (shouldLoad) {
          const script = document.createElement('script');
          script.setAttribute('data-goatcounter', 'https://syto.goatcounter.com/count');
          script.async = true;
          script.src = '//gc.zgo.at/count.js';
          document.head.appendChild(script);
        }
      }
    </script>
  </head>

  <body>
    <div id="app-root"></div>
  </body>
</html>
