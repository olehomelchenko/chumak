<!-- Pattern Matching Section -->
<div
  class="form-group"
  style="
    margin-bottom: 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--color-border);
  "
>
  <label class="form-label">Pattern Matching (optional):</label>

  <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem">
    <select
      class="form-input"
      x-model="selectPatternMode"
      @change="applyColumnPattern()"
      style="width: 120px"
    >
      <option value="include">Include</option>
      <option value="exclude">Exclude</option>
    </select>

    <select
      class="form-input"
      x-model="selectPatternMatchType"
      @change="applyColumnPattern()"
      style="width: 140px"
    >
      <option value="prefix">Starts with</option>
      <option value="suffix">Ends with</option>
      <option value="exact">Exact match</option>
    </select>

    <input
      type="text"
      class="form-input"
      x-model="selectPatternText"
      @input="applyColumnPattern()"
      placeholder="e.g., sales_ or _2023"
      style="flex: 1"
    />
  </div>

  <p class="form-help">
    Use patterns to quickly select/deselect columns. Examples: "sales_" for columns starting with
    "sales_", "_2023" for year columns
  </p>

  <div
    x-show="selectPatternText.trim() !== ''"
    style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--color-dark-gray)"
  >
    <span x-text="getPatternMatchInfo()"></span>
  </div>
</div>

<label class="form-label">Choose columns to keep:</label>

<div class="column-chips-multi">
  <template x-for="(column, index) in columns" :key="index">
    <button
      type="button"
      class="form-chip"
      style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
      :class="{ active: selectedColumns[index] }"
      @click="selectedColumns[index] = !selectedColumns[index]; updateSelectPreview()"
    >
      <span
        class="iconify"
        :data-icon="selectedColumns[index] ? 'carbon:checkmark-filled' : 'carbon:checkbox'"
        style="font-size: 1rem; flex-shrink: 0"
        :style="selectedColumns[index] ? 'color: var(--color-green)' : ''"
      ></span>
      <span
        x-text="column"
        style="
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          flex-grow: 1;
          text-align: left;
        "
      ></span>
    </button>
  </template>
</div>

<div class="form-actions">
  <button class="button button--text" @click="selectAllColumns()">Select All</button>
  <button class="button button--text" @click="selectNoColumns()">Select None</button>
</div>
