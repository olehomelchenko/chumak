<!-- Group By Section -->
<div class="form-group">
  <label class="form-label">Group By (Columns)</label>
  <div class="form-actions" style="margin-bottom: 0.5rem; display: flex; gap: 0.5rem">
    <button
      type="button"
      class="button button--text button--small"
      @click="aggregateDialogState.groupBy = [...columns]"
    >
      Select All
    </button>
    <button
      type="button"
      class="button button--text button--small"
      @click="aggregateDialogState.groupBy = []"
    >
      Select None
    </button>
  </div>

  <div class="column-chips-multi">
    <template x-for="col in columns" :key="col">
      <button
        type="button"
        class="form-chip"
        style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
        :class="{ active: aggregateDialogState.groupBy.includes(col) }"
        @click="aggregateDialogState.groupBy.includes(col) ? aggregateDialogState.groupBy = aggregateDialogState.groupBy.filter(c => c !== col) : aggregateDialogState.groupBy.push(col)"
      >
        <span
          class="iconify"
          :data-icon="aggregateDialogState.groupBy.includes(col) ? 'carbon:checkmark-filled' : 'carbon:checkbox'"
          style="font-size: 1rem; flex-shrink: 0"
          :style="aggregateDialogState.groupBy.includes(col) ? 'color: var(--color-green)' : ''"
        ></span>
        <span
          x-text="col"
          style="
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
            text-align: left;
          "
        ></span>
      </button>
    </template>
    <div x-show="columns.length === 0" style="color: #888; font-size: 0.8rem">
      No columns available
    </div>
  </div>
  <div class="form-help">Selected columns will define the grouping keys.</div>
</div>

<!-- Aggregations Section -->
<div class="form-group">
  <label class="form-label">Summarize / Rollup</label>

  <div style="margin-bottom: 0.5rem">
    <template x-for="(agg, index) in aggregateDialogState.aggregations" :key="index">
      <div
        style="
          display: flex;
          gap: 0.5rem;
          margin-bottom: 0.5rem;
          align-items: center;
          background: #f8f9fa;
          padding: 4px;
          border-radius: 4px;
        "
      >
        <!-- Column -->
        <select
          class="form-input"
          style="flex: 1"
          x-model="agg.col"
          @change="updateAggregateOutputName(index)"
          :disabled="agg.func === 'count'"
        >
          <option
            value=""
            x-text="agg.func === 'count' ? '(All rows)' : 'Select column...'"
          ></option>
          <template x-for="col in columns" :key="col">
            <option :value="col" x-text="col"></option>
          </template>
        </select>

        <!-- Function -->
        <select
          class="form-input"
          style="width: 100px"
          x-model="agg.func"
          @change="updateAggregateOutputName(index)"
        >
          <option value="count">Count</option>
          <option value="sum">Sum</option>
          <option value="mean">Mean</option>
          <option value="median">Median</option>
          <option value="min">Min</option>
          <option value="max">Max</option>
          <option value="distinct">Distinct</option>
          <option value="stdev">StDev</option>
          <option value="first">First</option>
          <option value="last">Last</option>
        </select>

        <span>&rarr;</span>

        <!-- Output Name -->
        <input
          type="text"
          class="form-input"
          style="flex: 1"
          x-model="agg.output"
          placeholder="Output name (auto-generated)"
        />

        <button
          class="button button--secondary button--small"
          @click="removeAggregation(index)"
          title="Remove"
        >
          ×
        </button>
      </div>
    </template>
  </div>

  <button class="button button--secondary button--small" @click="addAggregation()">
    + Add Aggregation
  </button>
</div>
<!-- Preview Button -->
<div class="form-group" style="margin-top: 1rem">
  <button
    class="button button--secondary"
    @click="previewAggregate()"
    :disabled="aggregateDialogState.isPreviewing"
  >
    <span x-show="!aggregateDialogState.isPreviewing">Preview Result</span>
    <span x-show="aggregateDialogState.isPreviewing">Previewing...</span>
  </button>
</div>
