<p class="form-help" style="margin-bottom: 1rem">
  Extracts text matching a pattern into a new column.
</p>

<div class="form-group">
  <label class="form-label">Source column:</label>
  <div class="column-chips">
    <template x-for="col in columns" :key="col">
      <button
        type="button"
        class="form-chip"
        style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
        :class="{ active: regexpExtractDialogState.sourceColumn === col }"
        @click="regexpExtractDialogState.sourceColumn = col; debouncedUpdateRegexpExtractPreview()"
      >
        <span
          class="iconify"
          data-icon="carbon:column"
          style="font-size: 1rem; flex-shrink: 0"
        ></span>
        <span
          x-text="col"
          style="
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            flex-grow: 1;
          "
        ></span>
      </button>
    </template>
  </div>
</div>

<div class="form-group">
  <label class="form-label">Pattern (regex):</label>
  <input
    type="text"
    class="form-input"
    x-model="regexpExtractDialogState.pattern"
    @input="validateRegexpExtractExpression(); debouncedUpdateRegexpExtractPreview()"
    placeholder="e.g., @(.+)$ to extract domain"
  />
</div>

<div class="form-group">
  <label class="form-label">Capture group (0 = entire match):</label>
  <input
    type="number"
    class="form-input"
    x-model.number="regexpExtractDialogState.group"
    min="0"
    max="9"
    style="width: 80px"
    @input="debouncedUpdateRegexpExtractPreview()"
  />
</div>

<div class="form-group">
  <label class="form-label">New column name:</label>
  <input
    type="text"
    class="form-input"
    x-model="regexpExtractDialogState.columnName"
    placeholder="e.g., domain"
    @input="debouncedUpdateRegexpExtractPreview()"
  />
</div>

<!-- Error message -->
<div
  x-show="regexpExtractDialogState.error"
  x-text="regexpExtractDialogState.error"
  style="
    color: var(--color-red);
    font-size: 13px;
    margin-top: 8px;
    white-space: pre-wrap;
    font-family: var(--font-family-mono);
  "
></div>

<!-- Help section -->
<div
  class="derive-help"
  style="
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--color-soft-bg);
    border-radius: 6px;
    border: 1px solid var(--border-color);
  "
>
  <div
    style="
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--color-dark-gray);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    "
  >
    <span>Pattern Examples</span>
    <button
      type="button"
      class="button button--ghost button--small"
      @click="openDialog('expressions')"
      style="font-size: 0.7rem; padding: 2px 6px"
    >
      Full Reference →
    </button>
  </div>
  <div
    style="
      font-size: 0.75rem;
      font-family: var(--font-family-mono);
      color: var(--color-text);
      line-height: 1.8;
    "
  >
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >(\d{4})-(\d{2})-(\d{2})</code
      >
      — date parts (1=year, 2=month, 3=day)
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >@(.+)$</code
      >
      — domain from email (group 1)
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >(?i)(error|warning)</code
      >
      — extract level (case-insensitive)
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >^([A-Z]{2})</code
      >
      — first 2 uppercase letters
    </div>
  </div>
</div>
