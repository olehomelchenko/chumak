<div class="form-group">
  <label class="form-label">Column to split:</label>
  <div class="column-chips">
    <template x-for="col in columns" :key="col">
      <button
        type="button"
        class="form-chip"
        style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
        :class="{ active: splitDialogState.column === col }"
        @click="selectSplitColumn(col)"
      >
        <span class="iconify" data-icon="carbon:column"></span>
        <span x-text="col"></span>
      </button>
    </template>
  </div>
</div>

<div class="form-group">
  <label class="form-label">Delimiter:</label>
  <div
    x-show="splitDialogState.autoDetectedDelimiter"
    style="font-size: 12px; color: var(--color-green); margin-bottom: 4px"
  >
    ✓ Auto-detected: <span x-text="splitDialogState.autoDetectedDelimiter"></span>
  </div>
  <div style="display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap">
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = ','; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      ,
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = ';'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      ;
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = '|'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      |
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = '-'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      -
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = '/'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      /
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = '\\'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      \
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 8px; font-size: 12px"
      @click="splitDialogState.delimiter = '@'; splitDialogState.isRegex = false; updateSplitPreview()"
    >
      @
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 12px; font-size: 12px"
      @click="splitDialogState.delimiter = '\\s+'; splitDialogState.isRegex = true; updateSplitPreview()"
    >
      <span class="iconify" data-icon="material-symbols-light:space-bar-rounded"></span>
    </button>
    <button
      type="button"
      class="button button--secondary"
      style="padding: 4px 12px; font-size: 12px"
      @click="splitDialogState.delimiter = '\\t'; splitDialogState.isRegex = true; updateSplitPreview()"
    >
      <span class="iconify" data-icon="material-symbols-light:keyboard-tab-rounded"></span>
    </button>
  </div>
  <input
    type="text"
    class="form-input"
    x-model="splitDialogState.delimiter"
    placeholder="Enter delimiter"
    @input="debouncedUpdateSplitPreview()"
  />
  <div style="margin-top: 8px">
    <label style="display: flex; align-items: center; gap: 8px">
      <input type="checkbox" x-model="splitDialogState.isRegex" @change="updateSplitPreview()" />
      <span style="font-size: 13px"
        >Use as regex pattern (e.g., <code>\s+</code> for whitespace, <code>[-_]</code> for dash or
        underscore)</span
      >
    </label>
  </div>
</div>

<div class="form-group">
  <label class="form-label">Split mode:</label>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: center; gap: 8px">
      <input
        type="radio"
        name="splitMode"
        value="spread"
        x-model="splitDialogState.mode"
        @change="updateSplitPreview()"
      />
      <span>Spread All - create column for each segment</span>
    </label>
    <label style="display: flex; align-items: center; gap: 8px">
      <input
        type="radio"
        name="splitMode"
        value="left"
        x-model="splitDialogState.mode"
        @change="updateSplitPreview()"
      />
      <span>Keep Left - keep only first segment</span>
    </label>
    <label style="display: flex; align-items: center; gap: 8px">
      <input
        type="radio"
        name="splitMode"
        value="right"
        x-model="splitDialogState.mode"
        @change="updateSplitPreview()"
      />
      <span>Keep Right - keep only last segment</span>
    </label>
    <label style="display: flex; align-items: center; gap: 8px">
      <input
        type="radio"
        name="splitMode"
        value="firstN"
        x-model="splitDialogState.mode"
        @change="updateSplitPreview()"
      />
      <span>Keep First N - limit number of columns</span>
    </label>
    <label style="display: flex; align-items: center; gap: 8px">
      <input
        type="radio"
        name="splitMode"
        value="lastN"
        x-model="splitDialogState.mode"
        @change="updateSplitPreview()"
      />
      <span>Keep Last N - keep last N segments</span>
    </label>
  </div>
</div>

<div
  class="form-group"
  x-show="splitDialogState.mode === 'firstN' || splitDialogState.mode === 'lastN'"
>
  <label class="form-label">Max columns:</label>
  <input
    type="number"
    class="form-input"
    x-model.number="splitDialogState.maxColumns"
    min="1"
    max="50"
    placeholder="e.g., 3"
    @input="debouncedUpdateSplitPreview()"
  />
</div>

<div class="form-group">
  <label style="display: flex; align-items: center; gap: 8px">
    <input type="checkbox" x-model="splitDialogState.keepOriginal" @change="updateSplitPreview()" />
    <span>Keep original column</span>
  </label>
</div>

<!-- Error message -->
<div
  x-show="splitDialogState.error"
  x-text="splitDialogState.error"
  style="
    color: var(--color-red);
    font-size: 13px;
    margin-top: 8px;
    white-space: pre-wrap;
    font-family: var(--font-family-mono);
  "
></div>
