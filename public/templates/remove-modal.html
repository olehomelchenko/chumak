<p class="form-help" style="margin-bottom: 0.75rem">Select columns to remove from the dataset:</p>

<div class="form-actions" style="margin-bottom: 0.5rem; display: flex; gap: 0.5rem">
  <button type="button" class="button button--text button--small" @click="selectAllForRemoval()">
    Select All
  </button>
  <button type="button" class="button button--text button--small" @click="selectNoneForRemoval()">
    Select None
  </button>
</div>

<div class="column-chips-multi">
  <template x-for="(col, index) in columns" :key="index">
    <button
      type="button"
      class="form-chip"
      style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
      :class="{ active: removedColumns[index] }"
      @click="toggleColumnForRemoval(index, $event)"
    >
      <span
        class="iconify"
        :data-icon="removedColumns[index] ? 'carbon:close-filled' : 'carbon:checkbox'"
        style="font-size: 1rem; flex-shrink: 0"
        :style="removedColumns[index] ? 'color: var(--color-red)' : ''"
      ></span>
      <span
        x-text="col"
        style="
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          flex-grow: 1;
          text-align: left;
        "
      ></span>
    </button>
  </template>
</div>

<p class="form-help" style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--color-dark-gray)">
  Tip: Cmd/Ctrl + click to toggle individual columns
</p>
