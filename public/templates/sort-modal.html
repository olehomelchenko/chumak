<div class="form-group">
  <label class="form-label">Sort by:</label>
  <div class="column-chips">
    <template x-for="col in columns" :key="col">
      <button
        type="button"
        class="form-chip"
        style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
        :class="{ active: sortDialogState.field === col }"
        @click="sortDialogState.field = col"
      >
        <span
          class="iconify"
          data-icon="carbon:column"
          style="font-size: 1rem; flex-shrink: 0"
        ></span>
        <span
          x-text="col"
          style="
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            flex-grow: 1;
          "
        ></span>
      </button>
    </template>
  </div>
</div>

<div class="form-group">
  <label class="form-label">Order:</label>
  <div style="display: flex; gap: 1rem">
    <label class="radio-label">
      <input type="radio" x-model="sortDialogState.order" value="asc" />
      <span>Ascending</span>
    </label>
    <label class="radio-label">
      <input type="radio" x-model="sortDialogState.order" value="desc" />
      <span>Descending</span>
    </label>
  </div>
</div>
