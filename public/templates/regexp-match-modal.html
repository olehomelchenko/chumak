<p class="form-help" style="margin-bottom: 1rem">
  Creates a boolean column indicating whether the pattern matches.
</p>

<div class="form-group">
  <label class="form-label">Source column:</label>
  <div class="column-chips">
    <template x-for="col in columns" :key="col">
      <button
        type="button"
        class="form-chip"
        style="flex-direction: row; justify-content: start; gap: 0.5rem; padding: 0.5rem 0.75rem"
        :class="{ active: regexpMatchDialogState.sourceColumn === col }"
        @click="regexpMatchDialogState.sourceColumn = col; debouncedUpdateRegexpMatchPreview()"
      >
        <span
          class="iconify"
          data-icon="carbon:column"
          style="font-size: 1rem; flex-shrink: 0"
        ></span>
        <span
          x-text="col"
          style="
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: left;
            flex-grow: 1;
          "
        ></span>
      </button>
    </template>
  </div>
</div>

<div class="form-group">
  <label class="form-label">Pattern (regex):</label>
  <input
    type="text"
    class="form-input"
    x-model="regexpMatchDialogState.pattern"
    @input="validateRegexpMatchExpression(); debouncedUpdateRegexpMatchPreview()"
    placeholder="e.g., ^[A-Z]{2}\d+"
  />
</div>

<div class="form-group">
  <label class="form-label">New column name:</label>
  <input
    type="text"
    class="form-input"
    x-model="regexpMatchDialogState.columnName"
    placeholder="e.g., is_valid_code"
    @input="debouncedUpdateRegexpMatchPreview()"
  />
</div>

<!-- Error message -->
<div
  x-show="regexpMatchDialogState.error"
  x-text="regexpMatchDialogState.error"
  style="
    color: var(--color-red);
    font-size: 13px;
    margin-top: 8px;
    white-space: pre-wrap;
    font-family: var(--font-family-mono);
  "
></div>

<!-- Help section -->
<div
  class="derive-help"
  style="
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--color-soft-bg);
    border-radius: 6px;
    border: 1px solid var(--border-color);
  "
>
  <div
    style="
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--color-dark-gray);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    "
  >
    <span>Pattern Examples</span>
    <button
      type="button"
      class="button button--ghost button--small"
      @click="openDialog('expressions')"
      style="font-size: 0.7rem; padding: 2px 6px"
    >
      Full Reference →
    </button>
  </div>
  <div
    style="
      font-size: 0.75rem;
      font-family: var(--font-family-mono);
      color: var(--color-text);
      line-height: 1.8;
    "
  >
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >^[A-Z]{2}</code
      >
      — starts with 2 uppercase letters
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >\d{3}-\d{4}</code
      >
      — phone format 123-4567
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >(?i)error</code
      >
      — case-insensitive "error"
    </div>
    <div>
      <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
        >@.+\.com$</code
      >
      — ends with @...com
    </div>
  </div>
</div>
