<label class="form-label">Keep rows where:</label>
<input
  type="text"
  class="form-input"
  x-model="filterExpression"
  placeholder="e.g., sales > 1000"
  @input="validateFilterExpression(); debouncedUpdateFilterPreview()"
/>

<!-- Preview mode toggle -->
<div style="margin-top: 0.75rem; display: flex; align-items: center; gap: 0.5rem">
  <span style="font-size: 0.8rem; color: var(--color-dark-gray)">Preview:</span>
  <button
    type="button"
    class="button button--small"
    :class="filterPreviewMode === 'all' ? 'button--primary' : 'button--text'"
    @click="filterPreviewMode = 'all'; updateFilterPreview()"
  >
    Show All
  </button>
  <button
    type="button"
    class="button button--small"
    :class="filterPreviewMode === 'matching' ? 'button--primary' : 'button--text'"
    @click="filterPreviewMode = 'matching'; updateFilterPreview()"
  >
    Matching Only
  </button>
</div>

<!-- Error message -->
<div
  x-show="filterError"
  x-text="filterError"
  style="
    color: var(--color-red);
    font-size: 13px;
    margin-top: 8px;
    white-space: pre-wrap;
    font-family: var(--font-family-mono);
  "
></div>

<!-- Quick Examples -->
<div
  class="expression-help"
  style="
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--color-soft-bg);
    border-radius: 6px;
    border: 1px solid var(--border-color);
  "
>
  <div
    style="
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--color-dark-gray);
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    "
  >
    <span>Quick Examples</span>
    <button
      type="button"
      class="button button--text button--small"
      @click="openDialog('expressions')"
      style="font-weight: 500; text-decoration: underline"
    >
      Full Reference
    </button>
  </div>

  <div
    style="
      font-size: 0.75rem;
      font-family: var(--font-family-mono);
      color: var(--color-text);
      line-height: 1.8;
    "
  >
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem 1rem">
      <div>
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >sales > 1000</code
        >
      </div>
      <div>
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >price <= 100</code
        >
      </div>
      <div>
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >region == "North"</code
        >
      </div>
      <div>
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >status != "cancelled"</code
        >
      </div>
      <div style="grid-column: 1 / -1">
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >sales > 1000 && region == "North"</code
        >
        — combine with AND
      </div>
      <div style="grid-column: 1 / -1">
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >status == "pending" || status == "review"</code
        >
        — combine with OR
      </div>
      <div style="grid-column: 1 / -1">
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >year(order_date) == 2024</code
        >
        — date functions
      </div>
      <div style="grid-column: 1 / -1">
        <code style="background: var(--color-white); padding: 2px 4px; border-radius: 3px"
          >regexp_match(email, "@gmail\\.com$")</code
        >
        — regex patterns
      </div>
    </div>
  </div>
</div>
