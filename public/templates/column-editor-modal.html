<!-- Mode Toggle -->
<div class="form-group" style="margin-bottom: 1rem">
  <div style="display: flex; gap: 0.5rem">
    <button
      type="button"
      class="button button--small"
      :class="{ 'button--primary': columnEditorState.mode === 'list' }"
      @click="columnEditorState.mode = 'list'"
    >
      <span class="iconify" data-icon="carbon:list" style="font-size: 1rem"></span>
      List Mode
    </button>
    <button
      type="button"
      class="button button--small"
      :class="{ 'button--primary': columnEditorState.mode === 'text' }"
      @click="switchColumnEditorToText()"
    >
      <span class="iconify" data-icon="carbon:text-align-left" style="font-size: 1rem"></span>
      Text Mode
    </button>
  </div>
</div>

<!-- List Mode -->
<template x-if="columnEditorState.mode === 'list'">
  <div>
    <!-- Pattern Matching Section -->
    <div
      class="form-group"
      style="
        margin-bottom: 1rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--color-border);
      "
    >
      <label class="form-label">Pattern Matching (optional):</label>

      <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem">
        <select class="form-input" x-model="columnEditorState.patternMode" style="width: 120px">
          <option value="include">Select</option>
          <option value="exclude">Deselect</option>
        </select>

        <select
          class="form-input"
          x-model="columnEditorState.patternMatchType"
          style="width: 140px"
        >
          <option value="prefix">Starts with</option>
          <option value="suffix">Ends with</option>
          <option value="exact">Exact match</option>
        </select>

        <input
          type="text"
          class="form-input"
          x-model="columnEditorState.patternText"
          placeholder="e.g., sales_ or _2023"
          style="flex: 1"
        />

        <button
          type="button"
          class="button button--small button--primary"
          @click="applyColumnEditorPattern()"
          :disabled="!columnEditorState.patternText.trim()"
        >
          Apply
        </button>
      </div>

      <div class="form-actions" style="margin-top: 0.5rem">
        <button class="button button--text button--small" @click="selectAllColumnEditor()">
          Select All
        </button>
        <button class="button button--text button--small" @click="selectNoneColumnEditor()">
          Select None
        </button>
      </div>
    </div>

    <!-- Column List with Drag and Drop -->
    <div class="column-editor-list" style="display: flex; flex-direction: column; gap: 0.25rem">
      <template x-for="(item, index) in columnEditorState.columns" :key="item.original">
        <div
          class="column-editor-item"
          :class="{
            'column-editor-item--unselected': !item.selected,
            'column-editor-item--dragging': columnEditorState.draggedIndex === index
          }"
          draggable="true"
          @dragstart="handleColumnEditorDragStart(index, $event)"
          @dragover.prevent="handleColumnEditorDragOver($event)"
          @dragend="handleColumnEditorDragEnd()"
          @drop.prevent="handleColumnEditorDrop(index)"
          style="
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: grab;
          "
        >
          <!-- Drag Handle -->
          <span
            class="iconify"
            data-icon="carbon:draggable"
            style="font-size: 1rem; color: var(--color-dark-gray); flex-shrink: 0"
          ></span>

          <!-- Checkbox -->
          <button
            type="button"
            style="
              background: none;
              border: none;
              cursor: pointer;
              padding: 0;
              display: flex;
              align-items: center;
            "
            @click.stop="toggleColumnEditorColumn(index)"
          >
            <span
              class="iconify"
              :data-icon="item.selected ? 'carbon:checkmark-filled' : 'carbon:close-filled'"
              style="font-size: 1.25rem"
              :style="item.selected ? 'color: var(--color-green)' : 'color: var(--color-red)'"
            ></span>
          </button>

          <!-- Original Name -->
          <span
            style="
              font-size: 0.875rem;
              color: var(--color-dark-gray);
              min-width: 100px;
              flex-shrink: 0;
            "
            :style="!item.selected ? 'text-decoration: line-through; opacity: 0.6' : ''"
            x-text="item.original"
          ></span>

          <!-- Arrow -->
          <span
            class="iconify"
            data-icon="carbon:arrow-right"
            style="font-size: 0.875rem; color: var(--color-dark-gray); flex-shrink: 0"
            x-show="item.selected"
          ></span>

          <!-- Editable Name -->
          <input
            type="text"
            class="form-input"
            x-model="item.renamed"
            :disabled="!item.selected"
            @click.stop
            style="flex: 1; padding: 0.25rem 0.5rem; font-size: 0.875rem"
            :style="!item.selected ? 'opacity: 0.4' : ''"
          />
        </div>
      </template>
    </div>
  </div>
</template>

<!-- Text Mode -->
<template x-if="columnEditorState.mode === 'text'">
  <div>
    <!-- Sub-mode Selection -->
    <div class="form-group" style="margin-bottom: 1rem">
      <label class="form-label">Text Mode Operation:</label>
      <div style="display: flex; gap: 1rem; margin-top: 0.5rem">
        <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer">
          <input
            type="radio"
            name="textSubMode"
            value="rename"
            x-model="columnEditorState.textSubMode"
            @change="switchColumnEditorToText()"
          />
          <span>Rename</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer">
          <input
            type="radio"
            name="textSubMode"
            value="reorder"
            x-model="columnEditorState.textSubMode"
            @change="switchColumnEditorToText()"
          />
          <span>Reorder</span>
        </label>
        <label style="display: flex; align-items: center; gap: 0.25rem; cursor: pointer">
          <input
            type="radio"
            name="textSubMode"
            value="select"
            x-model="columnEditorState.textSubMode"
            @change="switchColumnEditorToText()"
          />
          <span>Select</span>
        </label>
      </div>
    </div>

    <!-- Help text based on sub-mode -->
    <p class="form-help" style="margin-bottom: 0.5rem">
      <template x-if="columnEditorState.textSubMode === 'rename'">
        <span
          >Enter new names for each column (one per line, same order). Must have exactly
          <strong x-text="columns.length"></strong> lines.</span
        >
      </template>
      <template x-if="columnEditorState.textSubMode === 'reorder'">
        <span
          >Rearrange column names to change order. Must include all
          <strong x-text="columns.length"></strong> columns.</span
        >
      </template>
      <template x-if="columnEditorState.textSubMode === 'select'">
        <span>Keep only the listed columns. Delete lines to remove columns.</span>
      </template>
    </p>

    <textarea
      class="form-input"
      x-model="columnEditorState.textValue"
      @input="validateColumnEditorText()"
      rows="12"
      style="font-family: monospace; font-size: 0.875rem"
      placeholder="Enter column names, one per line..."
    ></textarea>

    <div
      x-show="columnEditorState.textError"
      style="margin-top: 0.5rem; color: var(--color-red); font-size: 0.875rem"
      x-text="columnEditorState.textError"
    ></div>
  </div>
</template>

<!-- Change Preview -->
<div
  x-show="getColumnEditorChanges().hasChanges"
  style="
    margin-top: 1rem;
    padding: 0.75rem;
    background: var(--color-surface);
    border-radius: var(--radius-sm);
    font-size: 0.875rem;
  "
>
  <div style="font-weight: 600; margin-bottom: 0.5rem">Changes Preview:</div>

  <!-- Removed columns -->
  <template x-if="getColumnEditorChanges().removed.length > 0">
    <div style="margin-bottom: 0.5rem">
      <span style="color: var(--color-red)">
        <span class="iconify" data-icon="carbon:close" style="font-size: 0.875rem"></span>
        Remove:
      </span>
      <span x-text="getColumnEditorChanges().removed.join(', ')"></span>
    </div>
  </template>

  <!-- Renamed columns -->
  <template x-if="getColumnEditorChanges().renamed.length > 0">
    <div style="margin-bottom: 0.5rem">
      <span style="color: var(--color-primary)">
        <span class="iconify" data-icon="carbon:edit" style="font-size: 0.875rem"></span>
        Rename:
      </span>
      <template x-for="r in getColumnEditorChanges().renamed" :key="r.from">
        <span style="margin-left: 0.25rem" x-text="r.from + ' → ' + r.to"></span>
      </template>
    </div>
  </template>

  <!-- Reordered -->
  <template x-if="getColumnEditorChanges().reordered">
    <div>
      <span style="color: var(--color-accent)">
        <span class="iconify" data-icon="carbon:arrows-vertical" style="font-size: 0.875rem"></span>
        Column order changed
      </span>
    </div>
  </template>
</div>
